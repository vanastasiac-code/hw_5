<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
    <link rel="stylesheet" href="../style/style.css" />
  </head>
  <body>
    <header class="header">
      <nav class="header_nav">
        <ul class="header__list">
          <li class="header__list-item">
            <a href="../index.html" class="header__list-link">Home</a>
          </li>
          <li class="header__list-item">
            <a href="#contact" class="header__list-link">Contact</a>
          </li>
          <li class="header__list-item">
            <a href="#registration" class="header__list-link">Registration</a>
          </li>
          <li class="header__list-item">
            <a href="./tables.html" class="header__list__link">Tables</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="registration">
        <h1 class="hero__title">Registration form about you</h1>
        <form action="/submit-form" method="post" class="register__form">
          <label for="name">Enter your name and surname:</label>
          <input type="text" name="name" id="name" required />
          <label for="email">Enter your email:</label>
          <input type="email" name="email" id="email" required />
          <label for="password">Come up with a password:</label>
          <input type="password" name="password" id="password" required />
          <label for="tel">Enter your phone number:</label>
          <input type="tel" name="tel" id="tel" required />
          <label for="age">Enter your age:</label>
          <input type="number" name="age" id="age" required />
          <label for="birthdate">Enter your birthdate:</label>
          <input type="date" name="birthdate" id="birthdate" required />
          <label for="photo">Download your photo:</label>
          <input type="file" name="photo" id="photo" />
          <fieldset>
            <legend>Choose your sex:</legend>
            <label for="male">Male</label>
            <input type="radio" name="sex" id="male" value="male" />
            <label for="female">Female</label>
            <input type="radio" name="sex" id="female" value="female" />
          </fieldset>
          <fieldset>
            <legend>Choose your hobby:</legend>
            <label for="reading">Reading</label>
            <input type="checkbox" name="hobby" id="reading" value="reading" />
            <label for="dancing">Dancing</label>
            <input type="checkbox" name="hobby" id="dancing" value="dancing" />
            <label for="running">Running</label>
            <input type="checkbox" name="hobby" id="running" value="running" />
            <label for="singing">Singing</label>
            <input type="checkbox" name="hobby" id="singing" value="singing" />
            <label for="another">Your option</label>
            <input type="text" name="hobby" id="another" class="option" />
          </fieldset>
          <label>
            Choose your direction:
            <select name="direction">
              <option value="frontend">Front-end</option>
              <option value="frontback">Front-back</option>
              <option value="fullstack">Fullstack</option>
            </select>
          </label>
          <textarea
            rows="4"
            cols="40"
            name="qualities"
            placeholder="Describe your positive qualities"
          ></textarea>
          <button type="submit" class="btn__form">Submit</button>
          <button type="reset" class="btn__form">Reset</button>
        </form>
      </section>
    </main>
    <footer id="contact" class="contact">
      <address class="contact__address">
        <a href="mailto:v.anastasia.c@gmail.com" class="contact__address-link"
          >v.anastasia.c@gmail.com</a
        >
        <a href="tel:+380664321592" class="contact__address-link"
          >+38(066)432 15 92</a
        >
      </address>
    </footer>
  </body>
</html>
